# Crossmart self-hosted stack.
#   Local development (infrastructure only):  docker compose up -d postgres redis
#   Full stack:                               docker compose --profile app up -d --build

name: crossmart

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://crossmart:crossmart@postgres:5432/crossmart
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crossmart
      POSTGRES_PASSWORD: crossmart
      POSTGRES_DB: crossmart
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crossmart -d crossmart']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['app']
    build:
      context: .
      target: migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      args:
        APP: api
    environment:
      <<: *app-environment
      API_PORT: 3000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      args:
        APP: worker
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
