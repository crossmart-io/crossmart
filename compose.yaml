# Crossmart self-hosted stack.
#   Local development (infrastructure only):  docker compose up -d postgres redis
#   Full stack:                               docker compose --profile app up -d --build
#
# POSTGRES_PASSWORD and REDIS_PASSWORD are required (compose reads them from the shell or .env).
# Generate URL-safe values, as they also go into DATABASE_URL and REDIS_URL:
#   openssl rand -hex 24
# PostgreSQL and Redis publish their ports on 127.0.0.1 only, for the API and worker running on
# this machine during development; they are never reachable from other hosts.

name: crossmart

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://crossmart:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -hex 24)}@postgres:5432/crossmart
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD (openssl rand -hex 24)}@redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}

# Optional settings the API and worker read, passed through from the shell or .env. Every one may
# be left unset; see .env.example for what each does.
x-app-optional-environment: &app-optional-environment
  WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
  CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:-}
  CREDENTIALS_MASTER_KEY_VERSION: ${CREDENTIALS_MASTER_KEY_VERSION:-1}
  CREDENTIALS_RETIRED_MASTER_KEYS: ${CREDENTIALS_RETIRED_MASTER_KEYS:-}
  SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
  SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
  EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
  EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
  EBAY_RU_NAME: ${EBAY_RU_NAME:-}
  EBAY_ENVIRONMENT: ${EBAY_ENVIRONMENT:-sandbox}
  EBAY_VERIFICATION_TOKEN: ${EBAY_VERIFICATION_TOKEN:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  ETSY_API_KEY: ${ETSY_API_KEY:-}
  ETSY_SHARED_SECRET: ${ETSY_SHARED_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ENTITLEMENTS_ENFORCED: ${ENTITLEMENTS_ENFORCED:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crossmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -hex 24)}
      POSTGRES_DB: crossmart
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crossmart -d crossmart']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD (openssl rand -hex 24)}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['app']
    build:
      context: .
      target: migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      args:
        APP: api
    environment:
      <<: [*app-environment, *app-optional-environment]
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      args:
        APP: worker
    environment:
      <<: [*app-environment, *app-optional-environment]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
