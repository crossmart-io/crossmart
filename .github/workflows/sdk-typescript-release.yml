name: Release TypeScript SDK

# Publishes @crossmart/sdk to npm. It runs only for a tag such as `sdk-ts-v0.1.0` (never on a
# branch push), or by hand from the Actions tab.
#
# Before the first release the maintainer must:
#   1. Create the `crossmart` organization on npmjs.com, so the `@crossmart` scope exists.
#   2. Create an npm automation token that can publish to it, and save it as the `NPM_TOKEN`
#      repository secret (Settings → Secrets and variables → Actions).
#   3. Set `version` in sdks/typescript/package.json, merge, and push a matching tag:
#        git tag sdk-ts-v0.1.0 && git push origin sdk-ts-v0.1.0
on:
  push:
    tags: ['sdk-ts-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://crossmart:crossmart@localhost:5432/crossmart
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Require the npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Set the NPM_TOKEN repository secret before releasing the SDK."
            exit 1
          fi

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        working-directory: sdks/typescript
        run: |
          expected="sdk-ts-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)."
            exit 1
          fi

      - name: Build the API and export its OpenAPI spec
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm build:api
          pnpm openapi:generate

      - name: Verify the SDK
        working-directory: sdks/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm check:drift

      # prepublishOnly runs lint, typecheck, tests and the build.
      - name: Publish
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
