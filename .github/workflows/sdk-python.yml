name: Python SDK

on:
  push:
    branches: [main]
  pull_request:
    # Any change to the API can change its OpenAPI document, so API sources are watched too.
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'sdks/python/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk-python.yml'

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/python

jobs:
  drift:
    name: Generated client matches the API
    runs-on: ubuntu-latest
    # The API connects to Postgres and Redis on startup, even when it only writes the spec.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crossmart
          POSTGRES_PASSWORD: crossmart
          POSTGRES_DB: crossmart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crossmart -d crossmart"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crossmart:crossmart@localhost:5432/crossmart
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the API and export its OpenAPI document
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm build:api
          pnpm openapi:generate
      - name: Install the pinned generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Regenerate the client
        run: scripts/generate.sh
      - name: Fail when the committed client is out of date
        run: |
          if [ -n "$(git status --porcelain -- crossmart/_generated)" ]; then
            git status --short -- crossmart/_generated
            git diff --stat -- crossmart/_generated
            echo "::error::crossmart/_generated is out of date. Run 'pnpm build && pnpm openapi:generate' at the repository root, then 'scripts/generate.sh' in sdks/python, and commit the result."
            exit 1
          fi

  verify:
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Build the distributions
        run: |
          python -m pip install build
          python -m build
