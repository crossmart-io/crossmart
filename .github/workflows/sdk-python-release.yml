# Publishes the Python SDK to PyPI when a tag such as `sdk-py-v0.1.0` is pushed.
#
# Nothing runs on branch pushes or pull requests. Before the first release, a maintainer must:
#   1. Create the `crossmart` project on PyPI (or claim the name with a first manual upload).
#   2. Add a trusted publisher to it: owner `crossmart-io`, repository `crossmart`,
#      workflow `sdk-python-release.yml`, environment `pypi`.
#   3. Create the `pypi` environment in the repository settings, ideally with required reviewers.
# The project releases by hand instead: see sdks/RELEASING.md.
name: Python SDK release

on:
  push:
    tags: ['sdk-py-v*']

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    if: github.repository == 'crossmart-io/crossmart'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag matches the package version
        run: |
          package_version="$(python -c 'import runpy; print(runpy.run_path("crossmart/_version.py")["__version__"])')"
          tag_version="${GITHUB_REF_NAME#sdk-py-v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crossmart/_version.py ($package_version)."
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
          ruff check . && ruff format --check . && mypy && pytest
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdks/python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crossmart/
    permissions:
      # Trusted Publishing: PyPI accepts this job's OIDC token instead of an API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
